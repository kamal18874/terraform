name: Terraform Deployment
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
      const token = await core.getIDToken('https://github.com');
      const payload = JSON.parse(
        Buffer.from(token.split('.')[1], 'base64url').toString()
      );

      console.log('OIDC subject (sub):', payload.sub);
      console.log('OIDC audience (aud):', payload.aud);
      console.log('OIDC repository:', payload.repository);
      console.log('OIDC ref:', payload.ref);
      console.log('OIDC repository_owner:', payload.repository_owner);

      - name: Fetch Keys from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://100.26.242.33:8200
          role: gh-actions-role
          method: jwt
          secrets: |
            aws/creds/terraform-role access_key | AWS_ACCESS_KEY_ID ;
            aws/creds/terraform-role secret_key | AWS_SECRET_ACCESS_KEY

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
